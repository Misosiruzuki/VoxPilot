name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (e.g. 1.2.4). Tag v{version} will be created if missing."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$V tag=v$V"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Bump displayed version in Main (usage banner)
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/VoxPilot 1\\.[0-9]\\+\\.[0-9]\\+/VoxPilot $V/" app-src/dev/voxpilot/app/Main.java || true
          grep -n "VoxPilot $V" app-src/dev/voxpilot/app/Main.java || echo "usage string may already differ"

      - name: Build VoxPilot.jar
        env:
          VOXPILOT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x scripts/build-jar.sh agent-src/gradlew
          ./scripts/build-jar.sh

      - name: Ensure tag exists (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: VoxPilot ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            VoxPilot.jar
            build/dist/VoxPilot.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
