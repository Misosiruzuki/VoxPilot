name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build VoxPilot.jar
        env:
          VOXPILOT_VERSION: "1.2.5-ci.${{ github.run_number }}"
        run: |
          chmod +x scripts/build-jar.sh agent-src/gradlew
          ./scripts/build-jar.sh

      - name: Upload VoxPilot.jar
        uses: actions/upload-artifact@v4
        with:
          name: VoxPilot-jar
          path: |
            VoxPilot.jar
            build/dist/VoxPilot.jar
          if-no-files-found: error
